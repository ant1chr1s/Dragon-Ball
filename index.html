<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scouter Guess — Dragon Ball Charakterrätsel</title>
<meta name="theme-color" content="#0b0e17">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0b0e17;
    --void-2:#11162a;
    --panel:#161d33;
    --panel-line:#2a3358;
    --gi-orange:#ff6d1f;
    --gi-orange-dim:#8a3d18;
    --scouter-blue:#33d1ff;
    --scouter-blue-dim:#0e4a5c;
    --ki-gold:#ffd54a;
    --namek-green:#39d97a;
    --ki-red:#ff4757;
    --text:#eef2ff;
    --text-dim:#8b93b8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,109,31,0.18), transparent 60%),
      radial-gradient(ellipse 900px 600px at 100% 0%, rgba(51,209,255,0.12), transparent 55%),
      var(--void);
    color:var(--text);
    font-family:'Chakra Petch', sans-serif;
    min-height:100vh;
    padding:20px 14px 60px;
  }
  .wrap{max-width:900px;margin:0 auto;}

  /* HUD header */
  header.hud{
    position:relative;
    border:1px solid var(--panel-line);
    background:linear-gradient(180deg, var(--panel), var(--void-2));
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:16px;
    overflow:hidden;
  }
  header.hud::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(180deg, rgba(51,209,255,0.035) 0px, rgba(51,209,255,0.035) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .hud-top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  h1{
    font-family:'Bungee', sans-serif;
    font-size:clamp(22px,5vw,34px);
    margin:0;
    letter-spacing:1px;
    color:var(--ki-gold);
    text-shadow:0 0 14px rgba(255,213,74,0.45), 0 0 2px rgba(255,109,31,0.8);
  }
  .subtitle{color:var(--scouter-blue); font-size:12px; letter-spacing:3px; text-transform:uppercase; margin-top:4px;}
  .hud-readout{
    font-family:'Share Tech Mono', monospace;
    font-size:11px; color:var(--text-dim); text-align:right; line-height:1.5;
  }
  .hud-readout b{color:var(--scouter-blue);}

  nav.tabs{display:flex; gap:8px; margin:14px 0 16px; flex-wrap:wrap;}
  .tab-btn, .lb-btn{
    font-family:'Chakra Petch', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.5px;
    padding:9px 16px;
    border-radius:8px;
    border:1px solid var(--panel-line);
    background:var(--panel);
    color:var(--text-dim);
    cursor:pointer;
    transition:all .15s ease;
  }
  .tab-btn:hover, .lb-btn:hover{border-color:var(--scouter-blue); color:var(--text);}
  .tab-btn.active{
    background:linear-gradient(135deg, var(--gi-orange), #c94d10);
    color:#1a0d04; border-color:var(--gi-orange);
  }
  .lb-btn{margin-left:auto;}

  .panel{
    border:1px solid var(--panel-line);
    background:var(--panel);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
  }

  .status-row{display:flex; gap:18px; flex-wrap:wrap; font-family:'Share Tech Mono', monospace; font-size:13px; color:var(--text-dim); margin-bottom:12px;}
  .status-row span b{color:var(--ki-gold); font-size:15px;}

  .search-wrap{position:relative;}
  input#guessInput{
    width:100%;
    font-family:'Chakra Petch', sans-serif;
    font-size:16px;
    padding:12px 14px;
    border-radius:9px;
    border:1px solid var(--panel-line);
    background:var(--void-2);
    color:var(--text);
    outline:none;
  }
  input#guessInput:focus{border-color:var(--scouter-blue); box-shadow:0 0 0 3px rgba(51,209,255,0.15);}
  .suggestions{
    position:absolute; top:calc(100% + 4px); left:0; right:0;
    background:var(--void-2); border:1px solid var(--panel-line); border-radius:9px;
    max-height:260px; overflow-y:auto; z-index:20;
    box-shadow:0 12px 30px rgba(0,0,0,0.5);
  }
  .suggestions.hidden{display:none;}
  .sugg-item{padding:10px 14px; cursor:pointer; font-size:14px; display:flex; justify-content:space-between; color:var(--text);}
  .sugg-item:hover, .sugg-item.active{background:rgba(51,209,255,0.12);}
  .sugg-item span.tag{color:var(--text-dim); font-size:12px;}

  .actions-row{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;}
  .ghost-btn{
    background:transparent; border:1px solid var(--panel-line); color:var(--text-dim);
    padding:8px 14px; border-radius:8px; font-size:12px; cursor:pointer; font-family:'Chakra Petch',sans-serif;
  }
  .ghost-btn:hover{border-color:var(--ki-red); color:var(--ki-red);}

  /* results table */
  .table-scroll{overflow-x:auto; margin-top:16px;}
  table.results{border-collapse:separate; border-spacing:6px; width:100%; min-width:760px;}
  table.results th{
    font-family:'Share Tech Mono', monospace;
    font-size:10.5px; letter-spacing:0.5px; text-transform:uppercase;
    color:var(--text-dim); font-weight:500; padding:2px 4px; text-align:center;
  }
  td.cell{
    text-align:center; vertical-align:middle; border-radius:9px;
    padding:10px 6px; font-size:12.5px; font-weight:600; line-height:1.25;
    border:1px solid rgba(255,255,255,0.06);
    min-width:88px;
  }
  td.char-cell{text-align:left; min-width:140px;}
  .avatar{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:50%; font-weight:700; font-size:13px;
    margin-right:8px; color:#0b0e17; vertical-align:middle;
    box-shadow:0 0 8px rgba(0,0,0,0.4);
  }
  .cell.correct{background:linear-gradient(145deg, rgba(57,217,122,0.28), rgba(57,217,122,0.1)); color:var(--namek-green); border-color:rgba(57,217,122,0.5); box-shadow:0 0 14px rgba(57,217,122,0.25);}
  .cell.partial{background:linear-gradient(145deg, rgba(255,213,74,0.26), rgba(255,213,74,0.08)); color:var(--ki-gold); border-color:rgba(255,213,74,0.45); box-shadow:0 0 14px rgba(255,213,74,0.18);}
  .cell.wrong{background:linear-gradient(145deg, rgba(255,71,87,0.22), rgba(255,71,87,0.06)); color:var(--ki-red); border-color:rgba(255,71,87,0.4);}
  .arrow{font-size:15px; margin-left:3px;}

  .win-banner{
    margin-top:16px; padding:16px; border-radius:12px; text-align:center;
    background:linear-gradient(135deg, rgba(255,213,74,0.15), rgba(255,109,31,0.12));
    border:1px solid rgba(255,213,74,0.4);
  }
  .win-banner h2{font-family:'Bungee',sans-serif; color:var(--ki-gold); margin:0 0 6px; font-size:20px;}
  .win-banner p{margin:4px 0; color:var(--text-dim); font-size:13px;}

  .name-submit{display:flex; gap:8px; margin-top:10px; justify-content:center; flex-wrap:wrap;}
  .name-submit input{
    padding:9px 12px; border-radius:8px; border:1px solid var(--panel-line); background:var(--void-2);
    color:var(--text); font-family:'Chakra Petch',sans-serif; font-size:13px; width:180px;
  }
  .primary-btn{
    background:linear-gradient(135deg, var(--scouter-blue), #1a7fa3);
    color:#04141a; border:none; padding:9px 16px; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px;
    font-family:'Chakra Petch',sans-serif;
  }
  .primary-btn:disabled{opacity:0.5; cursor:default;}
  .primary-btn.orange{background:linear-gradient(135deg, var(--gi-orange), #c94d10); color:#1a0d04;}

  footer.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:11px; color:var(--text-dim); margin-top:6px;}
  footer.legend .dot{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:middle;}

  /* modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(3,5,12,0.75); display:flex; align-items:flex-start; justify-content:center;
    padding:40px 14px; z-index:100; overflow-y:auto;
  }
  .modal-backdrop.hidden{display:none;}
  .modal{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:14px; padding:20px; max-width:520px; width:100%;
  }
  .modal h2{font-family:'Bungee',sans-serif; color:var(--ki-gold); font-size:18px; margin-top:0;}
  .modal-close{float:right; background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer;}
  .lb-tabs{display:flex; gap:8px; margin-bottom:12px;}
  .lb-tab{padding:6px 12px; border-radius:7px; border:1px solid var(--panel-line); background:var(--void-2); color:var(--text-dim); font-size:12px; cursor:pointer;}
  .lb-tab.active{background:var(--scouter-blue-dim); color:var(--scouter-blue); border-color:var(--scouter-blue);}
  .lb-list{list-style:none; margin:0; padding:0; font-family:'Share Tech Mono', monospace; font-size:13px;}
  .lb-list li{display:flex; justify-content:space-between; padding:8px 6px; border-bottom:1px solid var(--panel-line);}
  .lb-list li:first-child{color:var(--ki-gold);}
  .lb-empty{color:var(--text-dim); font-size:13px; padding:10px 0;}

  @media (max-width:640px){
    .hud-top{flex-direction:column; align-items:flex-start;}
    .hud-readout{text-align:left;}
  }
</style>
</head>

function lsGet(key){
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
function lsSet(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  }catch(e){ return false; }
}

async function loadDailyLb(){
  try{
    const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${DAILY_LB_FILE}`,{
      headers:{'Authorization':'token '+GITHUB_TOKEN,'Accept':'application/vnd.github.v3+json'}
    });
    if(!r.ok){ dailyLb = {}; dailyLbSha = ''; return false; }
    const d = await r.json();
    dailyLbSha = d.sha;
    dailyLb = JSON.parse(atob(d.content.replace(/\n/g,''))).leaderboard || {};
    return true;
  }catch(e){ dailyLb = {}; return false; }
}
async function saveDailyLb(){
  try{
    const content = btoa(unescape(encodeURIComponent(JSON.stringify({leaderboard:dailyLb}))));
    const body = { message:'update daily leaderboard', content };
    if(dailyLbSha) body.sha = dailyLbSha;
    const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${DAILY_LB_FILE}`,{
      method:'PUT',
      headers:{'Authorization':'token '+GITHUB_TOKEN,'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    if(!r.ok) return false;
    const d = await r.json();
    if(d.content) dailyLbSha = d.content.sha;
    return true;
  }catch(e){ return false; }
}

async function loadEndlessLb(){
  try{
    const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${ENDLESS_LB_FILE}`,{
      headers:{'Authorization':'token '+GITHUB_TOKEN,'Accept':'application/vnd.github.v3+json'}
    });
    if(!r.ok){ endlessLb = {}; endlessLbSha = ''; return false; }
    const d = await r.json();
    endlessLbSha = d.sha;
    endlessLb = JSON.parse(atob(d.content.replace(/\n/g,''))).leaderboard || {};
    return true;
  }catch(e){ endlessLb = {}; return false; }
}
async function saveEndlessLb(){
  try{
    const content = btoa(unescape(encodeURIComponent(JSON.stringify({leaderboard:endlessLb}))));
    const body = { message:'update endless leaderboard', content };
    if(endlessLbSha) body.sha = endlessLbSha;
    const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${ENDLESS_LB_FILE}`,{
      method:'PUT',
      headers:{'Authorization':'token '+GITHUB_TOKEN,'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    if(!r.ok) return false;
    const d = await r.json();
    if(d.content) endlessLbSha = d.content.sha;
    return true;
  }catch(e){ return false; }
}

function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function seededIndex(str, len){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h % len;
}
function avatarColor(name){
  let h=0; for(let i=0;i<name.length;i++) h = (h*17 + name.charCodeAt(i)) % 360;
  return `hsl(${h}, 65%, 55%)`;
}
function initials(name){
  return name.replace(/[()]/g,'').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

// ---------- STATE ----------
let mode = 'daily';
let target = null;
let guesses = []; // array of character objects
let finished = false;
let endlessStreak = 0;
let personal = { bestEndlessStreak:0, playerName:'', dailyDone:{} };

// ---------- INIT ----------
function init(){
  const p = lsGet('dbg-personal');
  if(p) personal = Object.assign(personal, p);
  startDaily();
  bindEvents();
}

function startDaily(){
  mode = 'daily';
  finished = false;
  guesses = [];
  const idx = seededIndex('dbg-'+todayStr(), CHARACTERS.length);
  target = CHARACTERS[idx];
  const progress = lsGet('dbg-daily-progress:'+todayStr());
  if(progress){
    guesses = progress.guesses.map(n => CHARACTERS[NAME_INDEX[n.toLowerCase()]]).filter(Boolean);
    finished = !!progress.finished;
  }
  render();
}

function startEndless(excludeName){
  mode = 'endless';
  finished = false;
  guesses = [];
  let pool = CHARACTERS;
  if(excludeName) pool = CHARACTERS.filter(c=>c.n!==excludeName);
  target = pool[Math.floor(Math.random()*pool.length)];
  render();
}

// ---------- EVALUATION ----------
function evaluate(guess, tgt){
  const res = {};

  // anime overlap
  const sameSet = guess.a.length===tgt.a.length && guess.a.every(x=>tgt.a.includes(x));
  const overlap = guess.a.some(x=>tgt.a.includes(x));
  res.anime = { status: sameSet?'correct':(overlap?'partial':'wrong'), label: guess.a.map(x=>ANIME_LABELS[x]).join('/') };

  // race
  let raceStatus = 'wrong';
  if(guess.r === tgt.r) raceStatus = 'correct';
  else {
    const bothSaiyanBlood = guess.r.includes('Saiyajin') && tgt.r.includes('Saiyajin');
    const bothNamek = guess.r.includes('Namek') && tgt.r.includes('Namek');
    const bothMensch = guess.r.includes('Mensch') && tgt.r.includes('Mensch');
    if(bothSaiyanBlood || bothNamek || bothMensch) raceStatus = 'partial';
  }
  res.race = { status: raceStatus, label: guess.r };

  // gender
  res.gender = { status: guess.g===tgt.g?'correct':'wrong', label: guess.g==='M'?'Männlich':'Weiblich' };

  // height
  let heightStatus, arrow='';
  if(guess.h === tgt.h){ heightStatus='correct'; }
  else if(guess.h < tgt.h){ heightStatus='wrong'; arrow='↑'; }
  else { heightStatus='wrong'; arrow='↓'; }
  res.height = { status: heightStatus, label: guess.h+' cm', arrow };

  // hair color
  res.hair = { status: guess.hc===tgt.hc?'correct':'wrong', label: guess.hc };

  // transformation tier
  let tStatus, tArrow='';
  if(guess.tt === tgt.tt){ tStatus='correct'; }
  else {
    tStatus = Math.abs(guess.tt-tgt.tt)<=1 ? 'partial' : 'wrong';
    tArrow = guess.tt < tgt.tt ? '↑' : '↓';
  }
  res.transform = { status: tStatus, label: guess.t, arrow: tArrow };

  // planet
  let pStatus = 'wrong';
  if(guess.p === tgt.p) pStatus = 'correct';
  else if(guess.p.split(' ')[0] === tgt.p.split(' ')[0]) pStatus = 'partial';
  res.planet = { status: pStatus, label: guess.p };

  res.win = sameSet && raceStatus==='correct' && res.gender.status==='correct' &&
            heightStatus==='correct' && res.hair.status==='correct' && tStatus==='correct' && pStatus==='correct';

  return res;
}

// ---------- RENDER ----------
function render(){
  renderStatus();
  renderTable();
  renderWinBanner();
  document.getElementById('newEndlessBtn').style.display = (mode==='endless') ? 'inline-block' : 'none';
}

function renderStatus(){
  const el = document.getElementById('statusRow');
  const hud = document.getElementById('hudStatus');
  if(mode==='daily'){
    el.innerHTML = `<span>Datum: <b>${todayStr()}</b></span><span>Versuche: <b>${guesses.length}</b></span>`;
  } else {
    el.innerHTML = `<span>Aktuelle Serie: <b>${endlessStreak}</b></span><span>Beste Serie: <b>${personal.bestEndlessStreak}</b></span><span>Versuche: <b>${guesses.length}</b></span>`;
  }
  hud.textContent = finished ? 'ZIEL ERFASST' : 'SCAN AKTIV ...';
}

function cellHtml(res, key, extra){
  const r = res[key];
  const arrow = r.arrow ? `<span class="arrow">${r.arrow}</span>` : '';
  return `<td class="cell ${r.status}">${r.label}${arrow}</td>`;
}

function renderTable(){
  const body = document.getElementById('resultsBody');
  body.innerHTML = '';
  // show most recent guess on top
  for(let i=guesses.length-1; i>=0; i--){
    const g = guesses[i];
    const res = evaluate(g, target);
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td class="cell char-cell"><span class="avatar" style="background:${avatarColor(g.n)}">${initials(g.n)}</span>${g.n}</td>` +
      cellHtml(res,'anime') +
      cellHtml(res,'race') +
      cellHtml(res,'gender') +
      cellHtml(res,'height') +
      cellHtml(res,'hair') +
      cellHtml(res,'transform') +
      cellHtml(res,'planet');
    body.appendChild(tr);
  }
}

function renderWinBanner(){
  const el = document.getElementById('winBanner');
  if(!finished){ el.innerHTML=''; return; }
  const won = guesses.length>0 && evaluate(guesses[guesses.length-1], target).win;
  if(won){
    el.innerHTML = `
      <div class="win-banner">
        <h2>⚡ Power Level bestätigt! Es ist ${target.n}!</h2>
        <p>Erraten in ${guesses.length} Versuch(en).</p>
        <div class="name-submit">
          <input type="text" id="nameInput" placeholder="Dein Name" value="${personal.playerName||''}">
          <button class="primary-btn" id="submitScoreBtn">Auf Rangliste eintragen</button>
        </div>
      </div>`;
    document.getElementById('submitScoreBtn').addEventListener('click', submitScore);
  } else {
    el.innerHTML = `
      <div class="win-banner">
        <h2>Aufgelöst: ${target.n}</h2>
        <p>Versuche es beim nächsten Mal!</p>
      </div>`;
  }
}

// ---------- ACTIONS ----------
async function submitGuess(name){
  if(finished) return;
  const idx = NAME_INDEX[name.trim().toLowerCase()];
  if(idx===undefined){ flashInputError(); return; }
  const g = CHARACTERS[idx];
  guesses.push(g);
  const res = evaluate(g, target);
  document.getElementById('guessInput').value='';
  hideSuggestions();

  if(res.win){
    finished = true;
    if(mode==='endless'){
      endlessStreak++;
      if(endlessStreak > personal.bestEndlessStreak) personal.bestEndlessStreak = endlessStreak;
      savePersonal();
    } else {
      lsSet('dbg-daily-progress:'+todayStr(), {guesses:guesses.map(c=>c.n), finished:true, won:true});
    }
  } else {
    if(mode==='daily'){
      lsSet('dbg-daily-progress:'+todayStr(), {guesses:guesses.map(c=>c.n), finished:false});
    }
  }
  render();
}

function flashInputError(){
  const inp = document.getElementById('guessInput');
  inp.style.borderColor = 'var(--ki-red)';
  setTimeout(()=>{ inp.style.borderColor=''; }, 500);
}

function giveUp(){
  if(finished) return;
  finished = true;
  if(mode==='endless'){
    if(endlessStreak > personal.bestEndlessStreak) personal.bestEndlessStreak = endlessStreak;
    endlessStreak = 0;
    savePersonal();
  } else {
    lsSet('dbg-daily-progress:'+todayStr(), {guesses:guesses.map(c=>c.n), finished:true, won:false});
  }
  render();
}

function savePersonal(){
  lsSet('dbg-personal', personal);
}

async function submitScore(){
  const nameInput = document.getElementById('nameInput');
  const pname = (nameInput.value || 'Namenloser Krieger').trim().slice(0,24);
  personal.playerName = pname;
  savePersonal();

  const btn = document.getElementById('submitScoreBtn');
  btn.textContent = 'Sende ...';
  btn.disabled = true;

  let ok;
  if(mode==='daily'){
    await loadDailyLb();
    const dateStr = todayStr();
    if(!dailyLb[dateStr]) dailyLb[dateStr] = {};
    dailyLb[dateStr][pname] = { attempts: guesses.length, won: true };
    ok = await saveDailyLb();
  } else {
    await loadEndlessLb();
    const prev = endlessLb[pname] || { streak:0, bestStreak:0 };
    endlessLb[pname] = {
      streak: endlessStreak,
      bestStreak: Math.max(prev.bestStreak||0, endlessStreak)
    };
    ok = await saveEndlessLb();
  }

  if(ok){
    btn.textContent = 'Eingetragen ✓';
  } else {
    btn.textContent = 'Fehler — erneut versuchen';
    btn.disabled = false;
  }
}

// ---------- SUGGESTIONS ----------
function renderSuggestions(query){
  const box = document.getElementById('suggestions');
  const q = query.trim().toLowerCase();
  if(!q){ box.classList.add('hidden'); box.innerHTML=''; return; }
  const guessedNames = new Set(guesses.map(g=>g.n));
  const matches = CHARACTERS.filter(c => c.n.toLowerCase().includes(q) && !guessedNames.has(c.n)).slice(0,8);
  if(matches.length===0){ box.classList.add('hidden'); box.innerHTML=''; return; }
  box.innerHTML = matches.map(c => `<div class="sugg-item" data-name="${c.n}">${c.n} <span class="tag">${c.a.map(x=>ANIME_LABELS[x]).join('/')}</span></div>`).join('');
  box.classList.remove('hidden');
  box.querySelectorAll('.sugg-item').forEach(el=>{
    el.addEventListener('click', ()=> submitGuess(el.getAttribute('data-name')));
  });
}
function hideSuggestions(){
  const box = document.getElementById('suggestions');
  box.classList.add('hidden'); box.innerHTML='';
}

// ---------- LEADERBOARD MODAL ----------
async function openLeaderboard(lbTab){
  document.getElementById('lbModal').classList.remove('hidden');
  await renderLeaderboard(lbTab||'daily');
}
function closeLeaderboard(){
  document.getElementById('lbModal').classList.add('hidden');
}
async function renderLeaderboard(which){
  document.getElementById('lbTabDaily').classList.toggle('active', which==='daily');
  document.getElementById('lbTabEndless').classList.toggle('active', which==='endless');
  const content = document.getElementById('lbContent');
  content.innerHTML = '<p class="lb-empty">Lade ...</p>';

  if(which==='daily'){
    const okLoad = await loadDailyLb();
    if(!okLoad){ content.innerHTML = '<p class="lb-empty">Rangliste konnte nicht geladen werden.</p>'; return; }
    const dayEntries = dailyLb[todayStr()] || {};
    const list = Object.entries(dayEntries).map(([name,v])=>({name, attempts:v.attempts}));
    list.sort((a,b)=> a.attempts - b.attempts);
    if(list.length===0){ content.innerHTML = '<p class="lb-empty">Noch keine Einträge für heute. Sei der Erste!</p>'; return; }
    content.innerHTML = `<ul class="lb-list">${list.map((e,i)=>`<li><span>#${i+1} ${e.name}</span><span>${e.attempts} Versuch(e)</span></li>`).join('')}</ul>`;
  } else {
    const okLoad = await loadEndlessLb();
    if(!okLoad){ content.innerHTML = '<p class="lb-empty">Rangliste konnte nicht geladen werden.</p>'; return; }
    const list = Object.entries(endlessLb).map(([name,v])=>({name, bestStreak:v.bestStreak||0}));
    list.sort((a,b)=> b.bestStreak - a.bestStreak);
    if(list.length===0){ content.innerHTML = '<p class="lb-empty">Noch keine Einträge. Starte eine Serie im Endlos-Modus!</p>'; return; }
    content.innerHTML = `<ul class="lb-list">${list.map((e,i)=>`<li><span>#${i+1} ${e.name}</span><span>Beste Serie: ${e.bestStreak}</span></li>`).join('')}</ul>`;
  }
}

// ---------- EVENTS ----------
function bindEvents(){
  document.getElementById('tabDaily').addEventListener('click', async ()=>{
    setTabActive('daily');
    await startDaily();
  });
  document.getElementById('tabEndless').addEventListener('click', ()=>{
    setTabActive('endless');
    endlessStreak = 0;
    startEndless();
  });
  document.getElementById('newEndlessBtn').addEventListener('click', ()=>{
    startEndless(target ? target.n : null);
  });
  document.getElementById('giveUpBtn').addEventListener('click', giveUp);

  const input = document.getElementById('guessInput');
  input.addEventListener('input', (e)=> renderSuggestions(e.target.value));
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){
      const q = input.value.trim().toLowerCase();
      if(NAME_INDEX[q]!==undefined){ submitGuess(input.value); }
    }
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.search-wrap')) hideSuggestions();
  });

  document.getElementById('openLeaderboard').addEventListener('click', ()=> openLeaderboard('daily'));
  document.getElementById('closeLb').addEventListener('click', closeLeaderboard);
  document.getElementById('lbModal').addEventListener('click', (e)=>{ if(e.target.id==='lbModal') closeLeaderboard(); });
  document.getElementById('lbTabDaily').addEventListener('click', ()=> renderLeaderboard('daily'));
  document.getElementById('lbTabEndless').addEventListener('click', ()=> renderLeaderboard('endless'));
}

function setTabActive(m){
  document.getElementById('tabDaily').classList.toggle('active', m==='daily');
  document.getElementById('tabEndless').classList.toggle('active', m==='endless');
}

init();
})();
</script>
